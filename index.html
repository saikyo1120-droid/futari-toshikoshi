<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15161f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="年越しぐらし">
<meta name="description" content="さいけうとゆいちゃんの年末年始5泊6日「ふたりの年越しぐらし」、ふたりだけのサイト">
<meta name="robots" content="noindex,nofollow">
<title>ふたりの年越しぐらし</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="supabase.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: 上に「雪の夜の神社」の切り絵（空の色が時間で変わる）、その下に和紙の帖面に今の画面。下の短冊タブで6画面を切り替える。
   墨・朱・金の和モダン。ダークモードでも同じ。 */
:root{
  color-scheme:light;
  --sea:#2a4d69; --sea-deep:#1d3650; --lagoon:#e9e2d3; --foam:#f3efe6;
  --sand:#f4ecdc; --sand-deep:#d9c9a8;
  --grass:#5b7d55; --leaf:#4d6b4a;
  --shu:#b5342a; --sun:#e0b84f; --hibiscus:#b4476b; --ai:#3b4a7a; --gold:#c9a24a; --kin:#e8cf7a;
  --ink:#2b2420; --muted:#6b5f57; --paper:#f7f1e6; --card:#fbf7ef; --line:#e3d7c3; --sumi:#1b1a1f;
  --pop:"Yuji Syuku","Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --min:"Zen Old Mincho","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --pixel:"Zen Old Mincho","Hiragino Mincho ProN",serif;
  --d1:#b5342a; --d2:#b8902e; --d3:#2f5d8a; --d4:#6b4e8a; --d5:#c2607c; --d6:#4d7a4a;
}
*{box-sizing:border-box}
html{background:#15161f}
body{margin:0;overflow-x:clip;color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px;line-height:1.7;
  background-color:#15161f;background-image:radial-gradient(circle at 20% 10%,rgba(201,162,74,.08),transparent 40%),radial-gradient(circle at 80% 90%,rgba(181,52,42,.08),transparent 40%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 2px,transparent 2px 14px),repeating-linear-gradient(-45deg,rgba(255,255,255,.015) 0 2px,transparent 2px 14px);padding-block:0 104px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--pop);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--sea-deep);font-weight:700}
.muted{color:var(--muted)}.small{font-size:13.5px}
.btn{border:2px solid var(--ink);background:var(--shu);color:#fff;border-radius:6px;padding:8px 20px;font-family:var(--pop);font-size:16px;letter-spacing:.06em;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-block;box-sizing:border-box;position:relative}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sea{background:var(--sea);color:#fff}.btn.pink{background:var(--hibiscus);color:#fff}.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.mini{padding:3px 12px;font-size:13.5px;box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* ============ 切り絵のヒーロー（雪の夜の神社） ============ */
.island{position:relative;margin:0 calc(50% - 50vw);width:100vw;height:clamp(600px,152vw,720px);overflow:hidden;background:#141a33;
  --sky1:#0f1430;--sky2:#1e2452;--sky3:#3a2f55;--snow1:#eef1f6;--snow2:#c9d2e2;--mtn1:#2a2d4a;--mtn2:#1c1f3a;--tree:#1a2230;--haze:.25;--stars:1;--moon:1;--sun:0;--lamp:1}
body[data-sky="dusk"] .island{--sky1:#2c2a5a;--sky2:#8a4a6a;--sky3:#e58a5a;--snow1:#f4e9e4;--snow2:#d6bfc4;--mtn1:#3d3353;--mtn2:#2a2342;--stars:.3;--moon:.5}
body[data-sky="dawn"] .island{--sky1:#2a2f5a;--sky2:#c76a63;--sky3:#ffb86b;--snow1:#f7ece4;--snow2:#e4c9bd;--mtn1:#4a3a58;--mtn2:#362b48;--stars:.15;--moon:0;--sun:1;--lamp:.8}
body[data-sky="day"] .island{--sky1:#9ab6d6;--sky2:#c9d9ea;--sky3:#e9eef5;--snow1:#ffffff;--snow2:#d8e0ec;--mtn1:#6b7a99;--mtn2:#4f5c7c;--tree:#2b3a3a;--haze:.45;--stars:0;--moon:0;--lamp:.55}
.island .scene{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.scene .sk1{stop-color:var(--sky1)}.scene .sk2{stop-color:var(--sky2)}.scene .sk3{stop-color:var(--sky3)}
.scene .sn1{stop-color:var(--snow1)}.scene .sn2{stop-color:var(--snow2)}
.scene .stars{fill:#fff;opacity:var(--stars);transition:opacity 1.5s;animation:twinkle2 4s ease-in-out infinite}
@keyframes twinkle2{0%,100%{opacity:var(--stars)}50%{opacity:calc(var(--stars)*.55)}}
.scene .moon{opacity:var(--moon);transition:opacity 1.5s}.scene .moonbite{fill:var(--sky1);transition:fill 1.5s}
.scene .sun{opacity:var(--sun);transition:opacity 1.5s;animation:sunrise 6s ease-out both}
@keyframes sunrise{from{transform:translateY(60px)}to{transform:translateY(0)}}
.scene .mtn.far{fill:var(--mtn1)}.scene .mtn.near{fill:var(--mtn2)}.scene .mtnsnow{fill:#fff;opacity:.85}
.scene .haze{fill:#fff;opacity:var(--haze);filter:blur(1px)}
.scene .tree{fill:var(--tree)}.scene .treesnow{fill:#fff;opacity:.9}
.scene .roofsnow{fill:#f4f6fb}.scene .kasagisnow{fill:#f4f6fb}
.scene .pillar,.scene .kasagi,.scene .nuki{fill:#c0392b}.scene .gakuzuka{fill:#d9d1c2}
.scene .rope{fill:none;stroke:#8c7a5a;stroke-width:7;stroke-linecap:round}.scene .shide{fill:none;stroke:#fff;stroke-width:3;stroke-linejoin:round}
.scene .glows{opacity:var(--lamp);transition:opacity 1.5s;animation:flicker 5s ease-in-out infinite}
.scene .toroglow{opacity:var(--lamp);animation:flicker 7s ease-in-out infinite reverse}
@keyframes flicker{0%,100%{opacity:var(--lamp)}50%{opacity:calc(var(--lamp)*.7)}}
.scene .snowbank{fill:#fff;opacity:.9}
.scene .stones path:first-child{fill:#b9b4ad;opacity:.9}.scene .stones .joint{fill:none;stroke:#8d8880;stroke-width:1.6;opacity:.8}
.scene .paper{pointer-events:none}
/* 降る雪（DOMの小さな丸） */
.snowfall{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.snowfall i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.85;animation:snow linear infinite;filter:blur(.3px)}
@keyframes snow{0%{transform:translate3d(0,-10px,0)}100%{transform:translate3d(var(--dx,0),110vh,0)}}
body[data-sky="day"] .snowfall i{opacity:.6}
/* 時間帯の帯（互換用、いまは使わない） */
.skytint,.stars,.moonbig,.glints,.softcloud{display:none}

/* ============ ロゴ（筆文字＋水引） ============ */
.logo{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:3;width:min(82%,420px);aspect-ratio:740/430;container-type:inline-size;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));animation:logo-in 1.1s cubic-bezier(.2,1.2,.4,1) both}
@keyframes logo-in{from{transform:translateX(-50%) translateY(-16px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.lg-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lg-svg text{text-anchor:middle;paint-order:stroke fill;stroke-linejoin:round;stroke-linecap:round}
.lg-top{font-family:var(--pop);font-size:46px;fill:#f7f1e6;stroke:#1b1a1f;stroke-width:10px;letter-spacing:6px}
.lg-main text{font-family:var(--pop);font-size:132px;fill:#f7f1e6;stroke:#1b1a1f;stroke-width:14px;letter-spacing:2px}
.lg-main .kin{fill:#e8cf7a}
.lg-sub{font-family:var(--min);font-weight:700;font-size:30px;letter-spacing:8px;fill:#f7f1e6;stroke:#1b1a1f;stroke-width:7px}
.lg-date{font-family:var(--min);font-size:22px;letter-spacing:5px;fill:#e8cf7a;stroke:#1b1a1f;stroke-width:5px}
.mizuhiki{fill:none;stroke-width:5;stroke-linecap:round}.mizuhiki.r{stroke:#c0392b}.mizuhiki.w{stroke:#f7f1e6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lg-bubble{display:none}
.sndbtn{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;z-index:4;width:40px;height:40px;border-radius:50%;border:2px solid var(--kin);background:rgba(27,26,31,.75);color:var(--kin);box-shadow:0 2px 8px rgba(0,0,0,.4);display:grid;place-items:center;padding:0;backdrop-filter:blur(3px)}
.sndbtn.wavebtn{top:58px;color:var(--kin)}
.sndbtn.wavebtn[aria-pressed="true"]{background:var(--shu);color:#fff;border-color:#fff}
.sndbtn svg{width:22px;height:22px}.sndbtn .off{display:none}.sndbtn[aria-pressed="false"] .on{display:none}.sndbtn[aria-pressed="false"] .off{display:block}

.miis{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,2vw,22px);z-index:2}
.mii{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mii .body{position:relative;z-index:1;animation:hop 3.2s ease-in-out infinite;transform-origin:50% 100%}
.mii img{height:clamp(200px,56vw,280px);width:auto;display:block;position:relative;z-index:1}
.mii.yui .body{animation-delay:-1.6s}.mii.yui img{height:calc(clamp(200px,56vw,280px)*.93)}
.mii.kon .body{animation:hop 2.1s ease-in-out infinite;animation-delay:-.7s}.mii.kon img{height:calc(clamp(200px,56vw,280px)*.5)}
.cos{position:absolute;inset:0;z-index:2;pointer-events:none}
.ci{position:absolute;filter:drop-shadow(0 2px 0 rgba(35,49,79,.25))}.ci svg{width:100%;height:auto;display:block;overflow:visible}
.mii.kon .nameplate{background:#e9e4d8;font-size:11.5px;padding:0 9px}
.mii.kon .bubble.talk{background:#f1eee6;left:auto;right:-6px;transform:translateX(0) scale(.6);transform-origin:85% 100%;max-width:min(170px,46vw)}.mii.kon .bubble.talk.show{transform:translateX(0) scale(1)}.mii.kon .bubble.talk::after{background:#f1eee6;left:auto;right:22px}
.konlove{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:900;margin-top:8px;color:var(--muted)}
.konlove img{height:28px;width:auto}
.konlove b{color:var(--hibiscus);letter-spacing:1px;font-size:15px}.konlove b i{color:#d9d9d9;font-style:normal}
.konlove span{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:0 8px;color:var(--ink)}
.konlove small{font-weight:700;font-size:10.5px;opacity:.8}
.mii .body.jump{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
.mii .body.bigjump{animation:bigjump .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes bigjump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-48px) scale(.94,1.1) rotate(-4deg)}60%{transform:translateY(-30px) scale(1,1) rotate(4deg)}100%{transform:translateY(0) scale(1.04,.96)}}
.mii .body.shake{animation:shake .6s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) translateX(-4px)}40%{transform:rotate(6deg) translateX(4px)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.mii .body.sway{animation:sway 2.4s ease-in-out}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg) translateY(2px)}70%{transform:rotate(3deg) translateY(2px)}}
.mii .body.hop2{animation:hop2 .7s ease-in-out}
@keyframes hop2{0%,100%{transform:translateY(0)}25%{transform:translateY(-14px)}50%{transform:translateY(0) scale(1.03,.97)}75%{transform:translateY(-10px)}}
.mii .body.run{animation:run .22s ease-in-out 6}
@keyframes run{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(.97,1.04)}}
.mii{transition:transform .45s cubic-bezier(.3,1.3,.5,1);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.mii img{-webkit-user-drag:none}
.mii.look-l{transform:rotate(-4deg) translateX(-4px)}.mii.look-r{transform:rotate(4deg) translateX(4px)}
.mii.kon{transition:transform .75s cubic-bezier(.3,1.3,.5,1)}
.mii.kon.run{z-index:4}
.fxp{position:absolute;top:6%;width:20px;height:20px;pointer-events:none;z-index:6;opacity:0;animation:fxfloat 1.5s ease-out forwards}
.fxp svg{width:100%;height:100%;overflow:visible;display:block}
.fxt{font-family:var(--pop);color:var(--ink);font-size:16px;line-height:1;text-shadow:0 0 4px #fff,0 0 4px #fff}
.fxt.ex{color:var(--shu);font-size:28px}.fxt.q{color:var(--ai);font-size:26px}
@keyframes fxfloat{0%{transform:translate(-50%,0) scale(.3) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-80px) scale(1) rotate(var(--r));opacity:0}}
@keyframes jump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-26px) scale(.96,1.06)}100%{transform:translateY(0) scale(1)}}
.mii::after{content:"";position:absolute;bottom:22px;width:70%;height:14px;border-radius:50%;background:rgba(80,60,20,.18)}
@keyframes hop{0%,82%,100%{transform:translateY(0) scale(1,1)}88%{transform:translateY(-14px) scale(.98,1.03)}94%{transform:translateY(0) scale(1.03,.97)}}
.nameplate{margin-top:-4px;position:relative;z-index:2;background:#fff;border:2px solid var(--ink);border-radius:4px;padding:0 12px;font-weight:900;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.mii.sai .nameplate{background:var(--lagoon)}.mii.yui .nameplate{background:#ffd0e0}
.mii.kon::after{bottom:16px;height:9px}
.bubble{position:absolute;z-index:3;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:6px 12px;font-weight:900;font-size:13px;line-height:1.4;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.bubble::after{content:"";position:absolute;bottom:-12px;width:16px;height:16px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.island.talking .bubble.count{opacity:0;transition:opacity .2s}
.bubble.count{transition:opacity .4s .3s;left:50%;transform:translateX(-50%);bottom:calc(7% + clamp(200px,56vw,280px) + 20px);font-family:var(--body);font-weight:900;font-size:14px;animation:float 3s ease-in-out infinite}
.bubble.count::after{left:calc(50% - 8px);bottom:-11px}
.bubble.count b{font-family:var(--pop);font-size:26px;color:var(--shu);font-weight:400;font-variant-numeric:tabular-nums}
.bubble.count .th{display:block;font-size:11.5px;color:var(--sea-deep);letter-spacing:.08em;margin-top:-2px;font-weight:900}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
.bubble.talk{bottom:calc(100% - 10px);left:50%;transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;z-index:5;background:#fffbe6;width:max-content;max-width:min(200px,56vw);white-space:normal;text-align:center;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.bubble.talk::after{left:calc(50% - 8px);background:#fffbe6}
.bubble.talk.show{opacity:1;transform:translateX(-50%) scale(1)}
.mii.yui .bubble.talk{background:#fff0f5}.mii.yui .bubble.talk::after{background:#fff0f5}

/* ============ 年越しカウントダウン ============ */
.nyover{position:fixed;inset:0;z-index:90;background:rgba(15,16,26,.9);display:grid;place-items:center;color:#f7f1e6;text-align:center;backdrop-filter:blur(4px);animation:enter .4s}
.nyover.done{background:radial-gradient(circle at 50% 40%,#b5342a,#3a1210 70%)}
.nyin{display:grid;gap:10px;padding:20px}
.nyl{font-family:var(--pop);font-size:clamp(22px,6vw,36px);letter-spacing:.3em;color:var(--kin)}
.nyn{font-family:var(--min);font-weight:900;font-size:clamp(64px,22vw,150px);line-height:1;font-variant-numeric:tabular-nums}
.nyn.big{font-size:clamp(110px,40vw,260px);color:var(--kin);font-family:var(--pop)}
.nys{font-family:var(--min);font-size:clamp(14px,4vw,20px);letter-spacing:.15em;line-height:1.9}
.nyx{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--kin);background:none;color:var(--kin);font-size:20px}
/* ============ 地図（Leaflet・古地図風） ============ */
.map{height:clamp(300px,78vw,420px)}
.map .leaflet-container,.map.leaflet-container{background:#e9dfc8;font-family:var(--body)}
.inkmap{filter:sepia(.55) saturate(.7) hue-rotate(-12deg) contrast(1.05) brightness(.98)}
.map-wait{height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px;background:#e9dfc8}
.lpin .lp{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--c);color:#fff;font-family:var(--min);font-weight:900;font-size:13px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink),0 2px 4px rgba(0,0,0,.4)}
.lpin.focus .lp{font-size:16px;box-shadow:0 0 0 2px var(--ink),0 0 0 6px rgba(224,184,79,.6)}
.lpin .lpl{position:absolute;left:calc(100% + 4px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11.5px;font-weight:900;color:var(--ink);background:rgba(247,241,230,.92);border:1px solid var(--ink);border-radius:3px;padding:0 5px;line-height:1.5;pointer-events:none}
.ldot span{display:block;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px var(--ink);opacity:.75}
.llm{display:grid;justify-items:center;pointer-events:none}.llm svg{width:22px;height:22px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}.llm span{font-size:10px;font-weight:900;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff;font-family:var(--min)}
.lme img{width:30px;height:30px;object-fit:cover;object-position:50% 12%;border-radius:50%;border:2px solid var(--kin);background:#fff;box-shadow:0 0 0 6px rgba(224,184,79,.35)}.lme span{position:absolute;left:34px;top:6px;font-size:11px;font-weight:900;white-space:nowrap;background:#fff;border:1px solid var(--ink);border-radius:3px;padding:0 4px}
.lpick span{display:block;width:30px;height:42px;background:var(--shu);clip-path:path("M15 42 C2 24 0 18 0 13 A15 13 0 0 1 30 13 C30 18 28 24 15 42 Z");filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.ltp .ring{display:block;width:44px;height:44px;border-radius:50%;overflow:hidden;border:3px solid var(--c);box-shadow:0 0 0 1.5px #fff,0 2px 5px rgba(0,0,0,.4);background:#fff}.ltp.est .ring{border-style:dashed}.ltp img{width:100%;height:100%;object-fit:cover}
.ltp b{position:absolute;right:-6px;top:-6px;min-width:18px;height:18px;border-radius:9px;color:#fff;font-size:11px;display:grid;place-items:center;border:1.5px solid #fff;padding:0 3px}
.ltip{font-family:var(--body);font-weight:700;font-size:12px}
.map .map-ctrl{z-index:500}.map .leaflet-control-attribution{font-size:9px;background:rgba(247,241,230,.8)}
.map:not(.touchmode) .leaflet-container{touch-action:pan-y}
/* ============ タブ ============ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(27,26,31,.94);border-top:2px solid var(--kin);box-shadow:0 -6px 18px rgba(0,0,0,.45);backdrop-filter:blur(6px);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.tab{--c:var(--shu);border:1.5px solid rgba(232,207,122,.35);background:rgba(247,241,230,.06);color:#e8dfcf;border-radius:4px;padding:5px 2px 4px;font-size:11px;font-weight:700;font-family:var(--min);display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .1s,background .2s}
.tab svg{width:24px;height:24px;stroke-width:1.9}
.tab[aria-selected="true"]{background:var(--c);color:#fff;border-color:#fff;transform:translateY(-3px);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.tab:nth-child(1){--c:var(--shu)}.tab:nth-child(2){--c:#9a6c1f}.tab:nth-child(3){--c:var(--hibiscus)}.tab:nth-child(4){--c:var(--sea)}.tab:nth-child(5){--c:var(--leaf)}.tab:nth-child(6){--c:#6b4e8a}
@media (max-width:420px){.tab{font-size:10px;padding:3px 0 2px}.tab svg{width:22px;height:22px}}

/* ============ ステータス ============ */
.status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media (max-width:480px){.status{grid-template-columns:1fr}}
.pcard{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;display:flex;gap:10px;align-items:center;box-shadow:3px 3px 0 var(--ink);min-width:0}
.pcard img{height:64px;width:auto;flex:0 0 auto}
.pcard.sai{background:linear-gradient(135deg,#f1ede2,#fff)}.pcard.yui{background:linear-gradient(135deg,#f6e9e6,#fff)}
.pc-in{min-width:0;flex:1}
.pc-name{font-family:var(--pop);font-size:16px;display:flex;align-items:center;gap:8px}
.lv{font-family:var(--pop);font-size:13px;background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:0 9px;line-height:1.5}
.pc-stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.stat{--c:var(--sea);display:inline-flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--ink);border-radius:4px;padding:1px 9px 1px 3px;box-shadow:0 2px 0 var(--ink)}
.stat i{font-style:normal;font-size:11px;font-weight:900;background:var(--c);color:#fff;border-radius:4px;padding:0 8px;line-height:1.7;letter-spacing:.02em}
.stat.ink i{color:var(--ink)}
.stat b{font-family:var(--pop);font-weight:400;font-size:17px;color:var(--ink);line-height:1.1;min-width:1ch;text-align:center}
.love{grid-column:1/-1;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink)}
.love-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:900}
.love-h b{font-family:var(--pop);font-size:22px;color:var(--hibiscus);font-weight:400}
.love-bar{height:14px;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:#fff;margin:4px 0}
.love-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hibiscus),var(--sun));transition:width .8s}
.love-s{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.love-s span{font-size:11.5px;font-weight:900;color:var(--ink);background:var(--sand);border:2px solid var(--ink);border-radius:4px;padding:0 8px;line-height:1.7}
.love-s span b{font-family:var(--pop);font-weight:400;font-size:13px;margin-left:3px}

/* ============ 画面切り替え ============ */
main.enter section.view:not([hidden]){animation:enter .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* ============ オープニング ============ */
.splash{position:fixed;inset:0;z-index:100;background:#15161f radial-gradient(circle at 50% 20%,#2a2250,#15161f 60%);display:grid;place-items:center;transition:opacity .6s,transform .6s;cursor:pointer;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash-in{display:grid;grid-template-columns:1fr 1fr;justify-items:center;align-items:end;width:100%;max-width:560px;position:relative;padding-top:min(62vw,300px)}
.splash .logo{top:0;width:min(94%,460px);animation-delay:.1s}
.splash-mii{height:clamp(190px,46vw,280px);width:auto;animation:sin .8s cubic-bezier(.2,1.5,.4,1) both}
.splash-mii.l{animation-delay:.25s;transform-origin:50% 100%}.splash-mii.r{animation-delay:.4s}
.splash-mii.k{position:absolute;right:4%;bottom:-6px;height:clamp(95px,23vw,140px);animation-delay:.55s}
@keyframes sin{from{transform:translateY(60px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.splash-tap{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--kin);font-family:var(--min);font-weight:700;letter-spacing:.3em;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ============ 行程エディター ============ */
.modal .box.editor{text-align:left;max-width:560px;max-height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:#fff}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ed-head h2{font-size:20px;color:var(--c)}
.ed-head .x{border:2px solid var(--ink);background:#fff;border-radius:50%;width:36px;height:36px;font-family:var(--pop);font-size:18px;line-height:1;box-shadow:2px 2px 0 var(--ink)}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.ed-grid{grid-template-columns:1fr}}
.fld{display:grid;gap:2px;font-size:12.5px;font-weight:900;color:var(--ink);margin-bottom:8px}
.fld input,.fld textarea,.ed-stop input{width:100%;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font:inherit;font-size:14px;color:var(--ink);background:#fff;min-width:0}
.fld textarea{min-height:60px;resize:vertical}
.ed-stops{display:grid;gap:8px;margin:6px 0 10px}
.ed-stop{background:var(--sand);border:2px solid var(--ink);border-radius:6px;padding:8px;display:grid;gap:6px}
.ed-stop-row{display:grid;grid-template-columns:72px 1fr auto;gap:6px;align-items:center}
@media (max-width:480px){.ed-stop-row{grid-template-columns:64px 1fr}.ed-stop-row .ed-btns{grid-column:1/-1;justify-content:flex-end}}
/* iPhoneは16px未満の入力欄にフォーカスすると画面が勝手に拡大するので、入力欄は16px */
@media (max-width:760px){.fld input,.fld textarea,.ed-stop input,.pk-search input,.pk-paste-in input,.iadd input,.iadd select,.page textarea,.letter textarea,.treasure textarea{font-size:16px}}
.ed-stop-row2{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
@media (max-width:480px){.ed-stop-row2{grid-template-columns:1fr}}
.ed-btns{display:flex;gap:4px}
.ed-btns button{border:2px solid var(--ink);background:#fff;border-radius:8px;width:30px;height:30px;padding:0;font-size:12px;font-weight:900}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--shu)}
.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.st-badge{display:inline-block;margin-left:6px;font-size:10px;background:var(--shu);color:#fff;border-radius:4px;padding:0 7px;vertical-align:middle;font-weight:900}
.daycard .ribbon .theme{font-size:12.5px;font-weight:900;background:rgba(255,255,255,.22);border-radius:4px;padding:0 9px;margin-left:auto}

/* ============ 島ニュース ============ */
.news{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink);margin-bottom:14px}
.news-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.news-tag{font-family:var(--pop);font-size:14px;background:var(--ai);color:#fff;border-radius:10px;padding:1px 10px}
.news ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.news li{font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px dashed var(--line)}
.news li:first-child{border-top:0}
.news .when{font-size:11px;font-weight:900;color:var(--sea-deep);background:var(--foam);border-radius:4px;padding:0 7px;flex:0 0 auto;line-height:1.7}
.news li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sea);flex:0 0 auto;align-self:center}
.news li.k-stamp::before,.news li.k-done::before{background:var(--shu)}.news li.k-food::before{background:var(--leaf)}.news li.k-diary::before,.news li.k-letter::before{background:var(--hibiscus)}.news li.k-mission::before{background:#c9902e}.news li.k-plan::before{background:var(--ai)}
/* ============ 日の出・月 ============ */
.sunrow{display:flex;gap:8px 10px;flex-wrap:wrap;font-size:12.5px;font-weight:900;color:var(--ink);margin:8px 0 4px}
.sunrow .sr{background:#fff;border:2px solid var(--line);border-radius:4px;padding:1px 9px 1px 5px}
.sunrow .sr{display:inline-flex;align-items:center;gap:4px}
.sunrow svg{width:20px;height:20px}
.moon-svg{width:20px;height:20px}
.daytabs button.today{position:relative}
.daytabs button.today::after{content:"";position:absolute;right:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--shu);border:2px solid #fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
/* ============ 持ち物 ============ */
.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 8px 6px 12px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;transition:background .3s}
.item.both{background:linear-gradient(90deg,#fff8d6,#f1ede2);border-color:var(--leaf);box-shadow:0 0 0 3px rgba(63,174,73,.18)}
.item .it{font-weight:700;font-size:14px;min-width:0}
.item .it small{display:inline-block;margin-left:6px;font-size:11px;font-weight:900;color:#fff;background:var(--ai);border-radius:4px;padding:0 7px;vertical-align:middle}
.iboxes{display:grid;grid-template-columns:38px 38px;gap:4px}
.ibox{position:relative;width:38px;height:38px;border:2px dashed #cfd8e6;border-radius:10px;display:grid;place-items:center;cursor:pointer;background:var(--foam)}
.ibox input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ibox img{height:30px;width:auto;opacity:.3;filter:grayscale(1);transition:.2s}
.ibox:has(input:checked){border:2px solid var(--leaf);background:#e8f8e8}
.ibox:has(input:checked) img{opacity:1;filter:none;transform:scale(1.05)}
.ibox:has(input:disabled){cursor:default}
.idel{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:4px;min-width:26px;height:26px;padding:0 6px;font-weight:900;font-size:14px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 0 var(--ink)}
.item.confirm{background:#fff2f0;border-color:var(--shu)}
.item.confirm .idel{background:var(--shu);color:#fff;border-color:var(--ink);font-size:12px;padding:0 10px;animation:pop .25s}
.iadd{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:8px}
.iadd input,.iadd select{border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font:inherit;background:#fff;min-width:0}
/* ============ 手紙 ============ */
.letters{margin-top:16px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:14px;box-shadow:3px 3px 0 var(--ink)}
.letters h3{font-size:17px}
.letter-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media (max-width:560px){.letter-grid{grid-template-columns:1fr}}
.letter{background:var(--sand);border:2px solid var(--ink);border-radius:6px;padding:10px;min-width:0}
.letter .env{width:72px;display:block;margin:0 auto 4px}
.lt-h{font-weight:900;text-align:center;font-size:13px;margin-bottom:6px}
.letter textarea{width:100%;min-height:120px;border:2px solid var(--ink);border-radius:10px;padding:8px;font:inherit;resize:vertical;background:#fff;margin-bottom:6px}
.lt-body{white-space:pre-wrap;background:#fff;border-radius:10px;padding:10px;line-height:1.9;overflow-wrap:anywhere;animation:enter .6s ease}
.letter .sealed{min-height:80px;text-align:center;color:var(--muted);font-weight:700;display:grid;place-items:center}
/* ============ グルメ図鑑 ============ */
.bar.green i{background:repeating-linear-gradient(45deg,var(--leaf) 0 10px,#7ccb45 10px 20px)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;margin-top:12px}
.food{background:#fff;border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:3px 3px 0 var(--ink);display:grid;grid-template-rows:auto 1fr}
.food.got{border-color:var(--leaf)}
.food-pic{position:relative;aspect-ratio:4/3;border:0;background:var(--foam);padding:0;overflow:hidden;display:grid;place-items:center;width:100%}
.food-pic img{width:100%;height:100%;object-fit:cover;display:block}
.food-pic svg{width:70%;opacity:.8}
.food-pic:not(:disabled){cursor:pointer}
.get-hint{position:absolute;right:6px;bottom:6px;background:var(--sea);color:#fff;font-size:11px;font-weight:900;border-radius:4px;padding:1px 8px}
.got-badge{position:absolute;left:-4px;top:8px;background:var(--shu);color:#fff;font-family:var(--pop);font-size:12px;padding:1px 10px 1px 12px;border-radius:0 99px 99px 0;transform:rotate(-6deg);box-shadow:0 2px 0 var(--ink)}
.food-in{padding:8px 10px 10px}
.food-n{font-weight:900;font-size:14px;line-height:1.3}
.food-d{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;font-weight:700}
.food-w{font-size:12px;font-weight:900;color:var(--sea-deep);margin-top:4px}
.food.got .food-w{color:var(--leaf)}
/* ============ いいね・称号 ============ */
.lb-bot .like{display:inline-flex;align-items:center;gap:6px}
.lb-bot .like svg{width:22px;height:22px}
.lb-bot .like.on{background:rgba(255,92,147,.3)}
.grid .tag.green{background:var(--leaf)}
.grid .heart{position:absolute;right:4px;top:2px;color:var(--hibiscus);font-size:16px;text-shadow:0 0 3px #fff}
.result .subtitles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.result .subtitles span{background:rgba(255,255,255,.15);border:2px solid var(--sun);border-radius:4px;padding:0 10px;font-size:12px}

/* ============ 誕生日 ============ */
.cake{width:22px;height:22px;vertical-align:middle}.cake.s{width:18px;height:18px}.cake.r{transform:scaleX(-1)}
.bday{display:flex;align-items:center;gap:10px;margin:8px 0 2px;background:linear-gradient(90deg,#fff0f5,#fff8d6);border:2px solid var(--hibiscus);border-radius:6px;padding:8px 12px;
  background-image:radial-gradient(circle at 12% 30%,rgba(255,92,147,.25) 2px,transparent 3px),radial-gradient(circle at 88% 70%,rgba(255,210,63,.5) 2px,transparent 3px),radial-gradient(circle at 60% 20%,rgba(19,181,200,.3) 2px,transparent 3px),linear-gradient(90deg,#fff0f5,#fff8d6)}
.bday .cake{width:30px;height:30px;flex:0 0 auto}
.bday b{font-family:var(--pop);font-weight:400;color:var(--hibiscus);font-size:15px;display:block}
.bday span{font-size:12.5px;color:var(--ink);font-weight:700}
.daytabs button.bday-tab::before{content:"";position:absolute;left:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--hibiscus);border:2px solid #fff}
.daytabs button{position:relative}
.bubble.count .cake{margin-right:2px}

/* ============ ログイン ============ */
.modal .box.login{max-width:420px}
.login .whopick button[aria-pressed="true"]{background:var(--sun);transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.login-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.login-form input{border:2px solid var(--ink);border-radius:4px;padding:8px 14px;font:inherit;font-size:16px;min-width:0;background:#fff}
.foot{text-align:center;padding:10px 0 20px}
.foot .linkbtn{color:#fff;opacity:.8;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.pw-form{display:grid;gap:8px;margin-top:12px}
.pw-form input{border:2px solid var(--ink);border-radius:4px;padding:8px 14px;font:inherit;font-size:16px;background:#fff}
.pw-btns{display:flex;gap:8px;justify-content:center}
/* ============ 画面の地（砂浜のボード） ============ */
.board-wrap{background:var(--paper);background-image:radial-gradient(circle at 10% 0,rgba(201,162,74,.12),transparent 40%),repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 1px,transparent 1px 7px);border:2px solid var(--ink);outline:2px solid var(--kin);outline-offset:3px;border-radius:6px;padding:18px clamp(12px,3.5vw,22px) 22px;margin-top:-18px;position:relative;z-index:4;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.board-wrap::before{content:"";position:absolute;inset:6px;border:1px solid rgba(181,52,42,.35);border-radius:3px;pointer-events:none}
section.view{position:relative}
.head{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.head .tag{background:var(--c,var(--shu));color:#fff;font-family:var(--pop);font-size:clamp(19px,5.2vw,25px);padding:4px 18px 6px;border-radius:4px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);letter-spacing:.08em}
.head .aside{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}

/* 吹き出し付きのMiiコメント */
.say{display:flex;gap:8px;align-items:flex-end;margin:10px 0}
.say img{width:46px;flex:0 0 auto}
.say .b{background:#fff;border:2px solid var(--ink);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:13px;font-weight:700;min-width:0;white-space:pre-line}

/* ============ 島めぐりマップ ============ */
.mapbox{display:grid;grid-template-columns:minmax(0,350px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.mapbox{grid-template-columns:1fr}}
.map-col{min-width:0}
@media (min-width:761px){.map-col{position:sticky;top:12px}}
.map{background:#e9dfc8;border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.map.touchmode{touch-action:none;box-shadow:4px 4px 0 var(--ink),0 0 0 4px var(--sun) inset}
.map{-webkit-touch-callout:none}
.map-ctrl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.map-ctrl button{min-width:36px;height:36px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-family:var(--pop);font-size:16px;box-shadow:2px 2px 0 var(--ink);padding:0 8px;color:var(--ink)}
.map-ctrl button.wide{font-size:12px}
.map-ctrl button.on{background:var(--sun)}
.ed-place{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ed-place .pl{font-size:12px;font-weight:900;color:var(--shu)}
.ed-place .pl.ok{color:#2e7d32}
.ed-place .pl.ok::before{content:"● ";}
.st-badge.off{background:#fff;color:var(--shu);border:2px solid var(--shu)}
.modal .box.picker{text-align:left;max-width:560px;background:#fff;max-height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.pk-search{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}
.pk-search input,.pk-paste-in input{width:100%;border:2px solid var(--ink);border-radius:10px;padding:7px 9px;font:inherit;font-size:14px;min-width:0}
.pk-results{display:grid;gap:6px;margin:4px 0}
.pk-hit{text-align:left;border:2px solid var(--ink);background:var(--sand);border-radius:12px;padding:6px 10px;font:inherit;display:grid;gap:1px}
.pk-hit b{font-size:14px}.pk-hit small{font-size:11.5px;color:var(--muted);font-weight:700}
.pk-hit.on{background:var(--sun)}
.pk-paste{margin:6px 0}
.pk-paste summary{font-size:12.5px;font-weight:900;cursor:pointer}
.pk-paste-in{display:grid;grid-template-columns:1fr auto;gap:6px;margin:6px 0 4px}
.pk-map{touch-action:none}

.gacha h3{font-size:19px;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
.gacha-stage{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0}
.machine{width:78px;flex:0 0 auto}
.machine .globe{transform-box:fill-box;transform-origin:50% 50%}
.machine.shake .globe{animation:shake .7s ease}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.mission-list{display:grid;gap:8px}
.mission{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:8px 10px;display:flex;gap:10px;align-items:center;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.mission .cap{width:10px;height:40px;border-radius:2px;flex:0 0 auto;border:1.5px solid var(--ink);background:linear-gradient(var(--c,var(--shu)) 30%,#f7f1e6 30%)}
.mission .txt{flex:1;min-width:0;font-weight:700}
.mission.done .txt{text-decoration:line-through;text-decoration-color:var(--shu);text-decoration-thickness:2px;opacity:.7}
.mission .ok{border:2px solid var(--ink);background:#fff;border-radius:4px;padding:2px 10px;font-weight:900;font-size:12px;flex:0 0 auto}
.mission.done .ok{background:var(--sun)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.gacha .hint{font-size:12px;opacity:.9;margin-top:8px}

/* ============ スタンプ ============ */
.prog-row{display:flex;align-items:center;gap:10px}
.prog-row .num{font-family:var(--pop);font-size:17px;white-space:nowrap}
.bar{flex:1;height:16px;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:#fff}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--shu) 0 10px,#ff7a6b 10px 20px);transition:width .8s}
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.spot{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:10px;position:relative;overflow:hidden;display:grid;gap:6px;align-content:start;box-shadow:3px 3px 0 var(--ink)}
.spot .top{display:flex;gap:6px;align-items:center}
.spot .day{font-size:11px;font-weight:900;color:#fff;background:var(--c);border-radius:4px;padding:0 9px;line-height:1.7}
.spot .nm{font-weight:900;font-size:15px;line-height:1.35}
.spot:has(.stampmark) .nm{padding-right:80px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{aspect-ratio:1;border:3px dashed #cfd8e6;border-radius:6px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);overflow:hidden;position:relative;background:var(--foam);padding:0;max-width:100%}
.slot img.ph{width:100%;height:100%;object-fit:cover}
.slot img.face{height:72%;width:auto;opacity:.32}
.slot .who{position:absolute;left:5px;top:5px;background:var(--ink);color:#fff;font-size:10px;font-weight:900;border-radius:4px;padding:0 7px;z-index:1}
.slot.mine{border-color:var(--sea);color:var(--sea-deep);font-weight:900;cursor:pointer;background:#e3fafb}
.slot.mine span.plus{font-family:var(--pop);font-size:26px;line-height:1}
.stampmark{position:absolute;right:4px;top:0;width:80px;height:96px;pointer-events:none;transform:rotate(-5deg);opacity:.95}
.stampmark.new{animation:thump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{0%{transform:rotate(-14deg) scale(2.6);opacity:0}60%{opacity:1}100%{transform:rotate(-14deg) scale(1)}}
.treasure{margin-top:16px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:14px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;box-shadow:3px 3px 0 var(--ink)}
.treasure svg{width:64px}
.treasure textarea{width:100%;min-height:90px;border:2px solid var(--ink);border-radius:10px;padding:8px;font:inherit;margin-top:6px}
.treasure .msg{white-space:pre-wrap;font-weight:700}

/* ============ 日記 ============ */
.diary{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.diary{grid-template-columns:1fr}}
.page{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:12px 14px;min-width:0;box-shadow:3px 3px 0 var(--ink);
  background-image:repeating-linear-gradient(transparent 0 31px,#d8eef0 31px 32px);background-position:0 54px}
.page.yui{border-top:10px solid var(--hibiscus)}.page.sai{border-top:10px solid var(--sea)}
.page h3{font-size:15px;display:flex;align-items:center;gap:8px}
.page h3 img{height:40px;width:auto}
.page textarea{width:100%;min-height:160px;border:0;background:transparent;font:inherit;line-height:32px;color:var(--ink);resize:vertical;padding:0;margin-top:4px}
.page .body{white-space:pre-wrap;line-height:32px;margin-top:4px;overflow-wrap:anywhere}
.sealed{display:grid;place-items:center;text-align:center;min-height:170px;color:var(--muted);font-weight:700}
.sealed svg{width:58px;margin:0 auto 4px;display:block}
.banner{margin-bottom:12px;background:var(--ai);color:#fff;border:2px solid var(--ink);border-radius:6px;padding:8px 12px;font-weight:900;display:flex;align-items:center;gap:8px}
.moon{width:22px;height:22px;border-radius:50%;box-shadow:inset -6px -2px 0 0 var(--sun);flex:0 0 auto}
.remind{margin-top:16px;background:var(--ai);color:#fff;border:2px solid var(--ink);border-radius:6px;padding:14px;box-shadow:3px 3px 0 var(--ink);
  background-image:radial-gradient(circle at 15% 30%,#fff 1px,transparent 2px),radial-gradient(circle at 70% 20%,#fff 1px,transparent 2px),radial-gradient(circle at 85% 70%,#fff 1.5px,transparent 2.5px),radial-gradient(circle at 40% 80%,#fff 1px,transparent 2px)}
.remind h3{font-size:17px;display:flex;align-items:center;gap:8px}

/* ============ アルバム ============ */
.uploadbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 2px}
.prog{font-size:13px;font-weight:900;color:var(--sea-deep)}
.album-day{margin-top:16px;content-visibility:auto;contain-intrinsic-size:auto 300px}
.album-day h3{font-size:16px;display:flex;align-items:center;gap:8px}
.album-day h3 .dot{width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:8px}
.grid button{padding:0;border:3px solid #fff;aspect-ratio:1;background:var(--foam);overflow:hidden;border-radius:10px;position:relative;max-width:100%;box-shadow:0 2px 0 rgba(35,49,79,.25)}
.grid button:nth-child(3n){transform:rotate(1.2deg)}.grid button:nth-child(3n+1){transform:rotate(-1deg)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .tag{position:absolute;left:4px;bottom:4px;background:var(--shu);color:#fff;font-size:10px;border-radius:4px;padding:0 6px;font-weight:900}
.empty{background:#fff;border:3px dashed var(--sand-deep);border-radius:6px;padding:20px;text-align:center;color:var(--muted);margin-top:12px;font-weight:700}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(6,30,40,.95);display:grid;grid-template-rows:auto 1fr auto;color:#fff;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}
.lb-top button,.lb-bot button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:4px;padding:6px 16px;font-weight:900}
.lb-stage{overflow:auto;display:grid;place-items:center;touch-action:pan-x pan-y pinch-zoom}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lb-stage.zoom img{max-width:none;max-height:none}

/* ============ リザルト ============ */
.result{background:linear-gradient(180deg,#1d3a8a,var(--ai));color:#fff;border:2px solid var(--ink);border-radius:6px;padding:18px;box-shadow:4px 4px 0 var(--ink);position:relative;overflow:hidden;font-weight:900}
.result .rays{position:absolute;left:50%;top:120px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,255,255,.08) 0 10deg,transparent 10deg 20deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.result h3{font-family:var(--pop);font-size:26px;color:var(--sun);text-align:center;position:relative;text-shadow:3px 3px 0 var(--shu)}
.result .pair{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-top:8px;position:relative}
.result .pair img{height:150px;width:auto}
.result .rows{display:grid;gap:8px;margin-top:10px;position:relative;background:rgba(0,0,0,.18);border-radius:6px;padding:10px 14px}
.result .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px dashed rgba(255,255,255,.3);padding-bottom:4px}
.result .r:last-child{border-bottom:0}
.result .r b{font-family:var(--pop);font-size:28px;font-weight:400;color:var(--sun);font-variant-numeric:tabular-nums}
.result .rank{margin-top:14px;text-align:center;position:relative}
.result .rank strong{display:inline-block;font-family:var(--pop);font-weight:400;font-size:clamp(20px,6vw,26px);color:var(--ink);background:var(--sun);border:2px solid var(--ink);border-radius:6px;padding:4px 16px;margin-top:6px;box-shadow:3px 3px 0 var(--ink)}
.locked{filter:grayscale(.6);opacity:.75}
.dayres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.dayres .c{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:8px 12px;font-size:13.5px;font-weight:700;box-shadow:2px 2px 0 var(--ink);border-top:10px solid var(--c)}
.dayres .c h4{margin:0 0 4px;font-family:var(--pop);font-weight:400;font-size:14px;color:var(--c)}

/* ============ モーダル等 ============ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,60,80,.55);display:grid;place-items:center;padding:20px;overflow:auto}
.modal.top{z-index:65}
/* ============ 思い出ムービー ============ */
.movie{position:fixed;inset:0;z-index:80;background:#071a26;color:#fff;overflow:hidden;font-family:var(--body)}
.movie .sh-stage{position:absolute;inset:0}
.movie .sl{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .7s ease}
.movie .sl.in{opacity:1}.show .sl.out{opacity:0}
.movie .sl.photo .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) brightness(.55);transform:scale(1.1)}
.movie .sl.photo img.main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s}
.movie .sl.photo img.main.ready{opacity:1;animation:kb var(--dur,4s) ease-in-out forwards}
@keyframes kb{from{transform:scale(1.02) translate(var(--x0,0),var(--y0,0))}to{transform:scale(1.12) translate(var(--x1,0),var(--y1,0))}}
.movie .cap{position:absolute;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:900;font-size:16px;text-shadow:0 2px 6px rgba(0,0,0,.8);padding:0 16px}
.movie .cap small{display:block;font-size:12px;opacity:.85;font-weight:700}
.movie .sl.title{background:linear-gradient(160deg,#2a4d69,#3b4a7a);text-align:center;padding:24px}
.movie .sl.title .no{font-family:var(--pop);font-size:clamp(22px,8vw,40px);color:#e0b84f;letter-spacing:.06em}
.movie .sl.title .dt{font-size:16px;font-weight:900;opacity:.9;margin-top:4px}
.movie .sl.title h2{font-family:var(--pop);font-size:clamp(26px,9vw,52px);margin:10px 0 4px;line-height:1.2}
.movie .sl.title .th{font-size:15px;font-weight:900;opacity:.9}
.movie .sl.title .cake{width:64px;height:64px;margin-top:10px}
.movie .sl.title .miis{position:static;display:flex;justify-content:center;gap:10px;margin-top:18px}
.movie .sl.title .miis img{height:150px;width:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.movie .sl.intro{background:linear-gradient(180deg,#2a4d69 0%,#0a7f9c 60%,#f4ecdc 60%,#f4ecdc 100%)}
.movie .sl.intro .logo{position:relative;left:auto;top:auto;transform:none;width:min(78%,360px);margin:0 auto 10px;animation:none}
.movie .sl.intro .introcap{margin-top:16px;color:var(--ink);text-align:center;font-weight:900;font-size:16px}
.movie .sl.intro .introcap small{display:block;font-size:12px;opacity:.8}
.movie .sl.diary{background:linear-gradient(160deg,#b4476b,#8a5cf6);padding:20px}
.movie .sl.diary .pages{display:grid;gap:12px;width:min(92%,640px)}
.movie .sl.diary .pg{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.6;white-space:pre-wrap;max-height:36vh;overflow:auto}
.movie .sl.diary .pg h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-family:var(--pop);font-size:14px;color:var(--hibiscus)}
.movie .sl.diary .pg h4 img{height:34px;width:auto}
.movie .sl.ending{background:linear-gradient(180deg,#1d3a8a,#3b4a7a);text-align:center;padding:24px 24px 120px;overflow:auto}
@media (max-height:720px){.movie .sl.ending .miis img{height:90px!important}.movie .sl.ending .rows{gap:4px}.movie .sl.title .miis img{height:110px}}
.movie .sl.ending h2{font-family:var(--pop);font-size:clamp(24px,8vw,44px);color:#e0b84f;margin:0 0 8px}
.movie .sl.ending .rows{display:grid;gap:6px;width:min(88%,420px);margin:12px auto}
.movie .sl.ending .rows div{display:flex;justify-content:space-between;background:rgba(255,255,255,.12);border-radius:12px;padding:6px 12px;font-weight:900}
.movie .sl.ending .rows b{font-family:var(--pixel);font-size:20px;color:#e0b84f}
.movie .sl.ending .rank{font-family:var(--pop);font-size:clamp(18px,6vw,30px);background:#e0b84f;color:var(--ink);border-radius:4px;padding:6px 18px;display:inline-block;margin-top:6px}
.movie .sl.ending .fin{margin-top:18px;font-family:var(--pop);letter-spacing:.3em;opacity:.8}
.movie .sh-top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:2;gap:8px}
.movie .sh-top select,.movie .sh-bot select{border:2px solid #fff;background:rgba(0,0,0,.4);color:#fff;border-radius:4px;padding:4px 10px;font:inherit;font-weight:900;font-size:12.5px}
.movie .sh-top button,.movie .sh-bot button{border:2px solid #fff;background:rgba(0,0,0,.4);color:#fff;border-radius:4px;padding:6px 12px;font:inherit;font-weight:900;font-size:13px;min-height:36px}
.movie .sh-bot{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;z-index:2}
.movie .sh-bot .cnt{font-family:var(--pixel);font-size:13px;opacity:.85;min-width:60px;text-align:center}
.movie .sh-bot button.big{width:48px;height:48px;padding:0;font-size:18px;display:grid;place-items:center}
.movie .sh-bot button.on{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.movie .sh-hint{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));text-align:center;font-size:12px;opacity:.8;z-index:2;font-weight:700}
.movie.hide-ui .sh-top,.movie.hide-ui .sh-bot,.movie.hide-ui .sh-hint{opacity:0;pointer-events:none;transition:opacity .4s}
.movie-box{margin-top:14px;background:linear-gradient(135deg,#b4476b,#8a5cf6);color:#fff;border:2px solid var(--ink);border-radius:6px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:4px 4px 0 var(--ink)}
.movie-box>div{flex:1 1 220px}
.movie-box h3{font-size:17px;margin:0 0 2px}
.movie-box .btn{margin-left:auto}
.sysbar{margin:0 0 12px;background:#fff3c4;border:2px solid var(--ink);border-radius:6px;padding:8px 12px;font-weight:900;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:3px 3px 0 var(--ink)}
.sysbar .btn{margin-left:auto}
.modal .box.diag{max-width:520px;text-align:left;background:#fff;max-height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.diag-list{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.diag-list li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;background:var(--sand);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:900}
.diag-list li i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-style:normal;font-family:var(--pop);font-size:13px}
.diag-list li.ok i{background:#7d9a6a}.diag-list li.ng i{background:var(--shu);color:#fff}.diag-list li.wait i{background:#fff}.diag-list li.warn i{background:var(--sun)}
.diag-list li small{display:block;font-weight:700;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.diag-fix{background:#eef1f4;border:3px solid var(--sea);border-radius:6px;padding:10px 12px;font-size:13px;margin:8px 0}
.diag-fix ol{margin:6px 0 0;padding-left:20px}
.diag-fix code{background:#fff;border-radius:6px;padding:0 4px;font-size:12px}
.modal .box{background:var(--sand);border:4px solid var(--ink);border-radius:6px;padding:20px;max-width:440px;width:100%;text-align:center;box-shadow:0 6px 0 var(--ink)}
.modal h2{font-size:22px}
.whopick{display:flex;justify-content:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.whopick button{border:2px solid var(--ink);background:#fff;border-radius:6px;padding:10px 10px 8px;width:130px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
.whopick img{height:140px;width:auto;display:block;margin:0 auto 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:#fff;padding:8px 16px;border-radius:4px;font-weight:900;font-size:13px;max-width:calc(100% - 32px);text-align:center;border:3px solid #fff}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:65}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<svg class="scene" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

    <radialGradient id="lampG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2c2"/><stop offset=".6" stop-color="#ffb24a"/><stop offset="1" stop-color="#e2641e"/></radialGradient>
    <radialGradient id="glowG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb24a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb24a" stop-opacity="0"/></radialGradient>
    <linearGradient id="snowG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sn1"/><stop offset="1" class="sn2"/></linearGradient>

function beep(kind){
  if(!SND.on)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=="running")actx.resume().catch(()=>{});
    const t=actx.currentTime,g=actx.createGain();g.connect(actx.destination);g.gain.value=.0001;
    const notes={tap:[[660,.06]],stamp:[[523,.08],[659,.08],[784,.14]],gacha:[[392,.05],[494,.05],[587,.05],[784,.12]],clear:[[784,.07],[1046,.16]],open:[[523,.06],[659,.06],[784,.06],[1046,.2]]}[kind]||[[660,.06]];

/* ---------- 冬の夜の風（合成の環境音。ときどき遠くで鈴が鳴る） ---------- */
const WAVE={on:false,nodes:null};
function wavesStart(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=="running")actx.resume().catch(()=>{});
    const sr=actx.sampleRate,len=sr*6,buf=actx.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.015*w)/1.015;d[i]=last*3.2}}
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=actx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=420;bp.Q.value=.55;   // 風のうなり
    const lp=actx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;
    const g=actx.createGain();g.gain.value=0;
    const lfo=actx.createOscillator();lfo.type="sine";lfo.frequency.value=.07;const lg=actx.createGain();lg.gain.value=.08;
    const lfo2=actx.createOscillator();lfo2.type="sine";lfo2.frequency.value=.023;const lg2=actx.createGain();lg2.gain.value=.05;
    const lfo3=actx.createOscillator();lfo3.type="sine";lfo3.frequency.value=.05;const lg3=actx.createGain();lg3.gain.value=260;lfo3.connect(lg3).connect(bp.frequency);
    const base=actx.createConstantSource();base.offset.value=.11;
    lfo.connect(lg).connect(g.gain);lfo2.connect(lg2).connect(g.gain);base.connect(g.gain);
    src.connect(bp).connect(lp).connect(g).connect(actx.destination);
    src.start();lfo.start();lfo2.start();lfo3.start();base.start();
    const bellT=setInterval(()=>{if(Math.random()<.5)suzu(.035)},14000);   // ときどき遠くの鈴
    WAVE.nodes={src,lfo,lfo2,base,g,lg,lg2,lfo3,bellT};WAVE.on=true;
  }catch(e){console.warn(e);toast("この端末では風の音を再生できませんでした")}
}
/* 鈴・鐘（合成） */
function suzu(vol=.08){try{if(!actx)return;const t=actx.currentTime;for(const [f,d] of [[2093,.6],[3136,.4],[4186,.25]]){const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f*(1+(Math.random()-.5)*.01);o.connect(g).connect(actx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}}catch{}}
function bonsho(n=1){ // 除夜の鐘
  if(!SND.on)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=="running")actx.resume().catch(()=>{});
    for(let k=0;k<n;k++){const t=actx.currentTime+k*2.6;for(const [f,d,v] of [[110,3.5,.25],[165,2.6,.12],[220,2.2,.1],[330,1.4,.06],[440,1,.04],[680,.5,.03]]){const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;o.connect(g).connect(actx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}}
  }catch{}}
function wavesStop(){if(!WAVE.nodes)return;const {src,lfo,lfo2,lfo3,base,lg,lg2,bellT}=WAVE.nodes;clearInterval(bellT);try{const t0=actx.currentTime;for(const prm of [base.offset,lg.gain,lg2.gain]){prm.cancelScheduledValues(t0);prm.setTargetAtTime(0,t0,.3)}setTimeout(()=>{try{src.stop();lfo.stop();lfo2.stop();lfo3.stop();base.stop()}catch{}},1200)}catch{}WAVE.nodes=null;WAVE.on=false}

/* エラーを「何が起きたか」で分類して、人間向けの説明にする */
function errInfo(e,where){
  const m=String(e?.message||e?.error_description||e?.error||e||"");const code=String(e?.code||e?.statusCode||e?.status||"");
  if(e?.code==="not_ready")return {kind:"busy",msg:e.message,fix:null};
  const net=(e instanceof TypeError&&/fetch|Load failed|network/i.test(m))||/Failed to fetch|NetworkError|Load failed|network|timeout|ECONN/i.test(m)||e?.status===0;
  if(net)return {kind:"network",msg:"電波がとどいていないみたい。少し待ってもう一度試してね",fix:"net"};
  if(/does not exist|42P01|42883|PGRST205|PGRST202|schema cache/i.test(m+code))return {kind:"setup",msg:/docs/i.test(m)?"保存先の表（docs）がまだ作られていません":"保存先の設定（表や関数）がまだ作られていません",fix:"sql"};
  if(where==="storage"&&(/Bucket not found|not found/i.test(m)||code==="404"))return {kind:"setup",msg:"写真の保存場所（photos）がまだ作られていません",fix:"sql"};
  if(/row-level security|permission denied|42501|not authorized|Unauthorized/i.test(m+code)||code==="403")return {kind:"setup",msg:"保存の許可（ポリシー）が設定されていないか、このアカウントは対象外です",fix:"sql"};
  if(/JWT|expired|token|PGRST301|invalid claim/i.test(m+code)||code==="401")return {kind:"auth",msg:"ログインの期限が切れていました。もう一度ログインしてね",fix:"login"};
  if(code==="413"||/too large|exceeded the maximum/i.test(m))return {kind:"size",msg:"写真が大きすぎました",fix:null};
  if(e?.code==="decode")return {kind:"decode",msg:"この写真は読み込めませんでした。別の写真で試してね",fix:null};
  if(e?.code==="quota_exceeded"||/quota/i.test(m))return {kind:"quota",msg:"保存できる量の上限に達しました",fix:null};
  return {kind:"other",msg:"保存できませんでした："+(m||"原因不明").slice(0,80),fix:"diag"};
}
function writeErr(e){console.warn(e);const i=errInfo(e,e?.where);S.lastErr={at:Date.now(),where:e?.where||"db",msg:i.msg,raw:String(e?.message||e)};toast(i.msg);if(i.fix==="sql"||i.fix==="diag")setTimeout(()=>showDiag(),900);if(i.fix==="login")setTimeout(()=>{showLogin("ログインの期限が切れました。もう一度入ってね")},900)}
const isAuthErr=e=>errInfo(e).kind==="auth",isNetErr=e=>errInfo(e).kind==="network";
/* 期限切れなら更新して1回やり直す／電波なら少し待って1回やり直す */
async function withRetry(fn,where){
  try{return await fn()}
  catch(e){
    if(isAuthErr(e)){try{await sb.auth.refreshSession()}catch(x){console.warn(x)}return await fn()}
    if(isNetErr(e)){await new Promise(r=>setTimeout(r,1500));return await fn()}
    throw e;
  }
}

const PW={ready:false,q:[],t:null};
function partnerWatch(){
  const me=S.who||"sai",pa=other(me);
  const snap=()=>({photos:S.photos.filter(p=>p.who===pa&&!p.food).length,foods:S.photos.filter(p=>p.who===pa&&p.food).map(p=>p.food),
    diary:Object.keys(S.diary).filter(k=>k.endsWith("_"+pa)),ms:Object.values(S.missions).flatMap(m=>m.draws||[]).filter(x=>x.done&&x.by===pa).length,
    plan:S.plan?.by===pa?(S.plan.updatedAt||0):0,letter:S.letters[pa]?.at||0,items:S.items?.by===pa?(S.items.at||0):0,
    best:Object.entries(S.best).filter(([k])=>k.endsWith("_"+pa)).map(([k,v])=>k+":"+v.photo),konms:Object.values(S.missions).flatMap(m=>m.draws||[]).filter(x=>x.done&&x.by===pa&&isKonM(x)).length});
  if(!PW.ready){PW.last=snap();PW.ready=true;PW.at=Date.now();return}
  const a=PW.last,b=snap();PW.last=b;const away=document.hidden||Date.now()-PW.at>60000;PW.at=Date.now();const evs=[];
  if(b.photos>a.photos)evs.push({kind:"photos",n:b.photos-a.photos});
  const nf=b.foods.filter(f=>!a.foods.includes(f));if(nf.length)evs.push({kind:"food",name:FOODBY[nf[0]]?.n||"グルメ"});
  const nd=b.diary.filter(k=>!a.diary.includes(k));if(nd.length)evs.push({kind:"diary",day:+nd[0].slice(1).split("_")[0]});
  if(b.konms>a.konms)evs.push({kind:"konmission"});else if(b.ms>a.ms)evs.push({kind:"mission"});
  const nb=b.best.filter(k=>!a.best.includes(k));if(nb.length)evs.push({kind:"best",day:+nb[0].slice(1).split("_")[0]});
  if(b.plan>a.plan)evs.push({kind:"plan"});
  if(b.letter>a.letter)evs.push({kind:"letter"});
  if(b.items>a.items)evs.push({kind:"items"});
  if(!evs.length)return;
  evs.forEach(e=>e.away=away);PW.q.push(...evs.slice(0,3));
  const run=()=>{const e=PW.q.shift();if(!e){PW.t=null;return}if(MOOD.visible&&!document.hidden)partnerReact(e);PW.t=setTimeout(run,5200)};
  if(!PW.t)PW.t=setTimeout(run,600);
}

/* ---------- ステータス（Lv・仲良し度） ---------- */
function stats(){
  const spots=SPOTS(),stamped=spots.filter(s=>{const p=spotPhotos(s.id);return p.sai&&p.yui}).length;
  const ms=Object.values(S.missions).flatMap(m=>m.draws||[]).filter(x=>x.done).length;
  const diaries=DAYS().filter(d=>S.diary[`d${d.n}_sai`]&&S.diary[`d${d.n}_yui`]).length;
  const foods=FOODS.filter(f=>foodPhoto(f.id)).length;
  const per=w=>({photos:S.photos.filter(p=>p.who===w).length,diary:DAYS().filter(d=>S.diary[`d${d.n}_${w}`]).length,missions:Object.values(S.missions).flatMap(m=>m.draws||[]).filter(x=>x.done&&x.by===w).length,foods:S.photos.filter(p=>p.food&&p.who===w).length});
  const pts=stamped*10+ms*8+diaries*12+foods*4+Math.min(S.photos.length,200)*.5;
  const love=Math.min(100,Math.round((stamped/Math.max(1,spots.length))*40+(diaries/6)*30+Math.min(ms,12)/12*15+(foods/FOODS.length)*15));
  return {spots:spots.length,stamped,ms,diaries,foods,pts,love,sai:per("sai"),yui:per("yui")};
}
function lvOf(p){return 1+Math.floor((p.photos*.5+p.diary*4+p.missions*3+p.foods*2)/6)}
function statusHTML(){
  const st=stats();
  const card=w=>{const p=st[w],lv=lvOf(p);return `<div class="pcard ${w}"><img src="${MII[w]}" alt=""><div class="pc-in"><div class="pc-name">${NAME[w]}<span class="lv">Lv.${lv}</span></div><div class="pc-stats"><span class="stat" style="--c:var(--sea)"><i>写真</i><b>${p.photos}</b></span><span class="stat" style="--c:var(--hibiscus)"><i>日記</i><b>${p.diary}</b></span><span class="stat ink" style="--c:var(--sun)"><i>ミッション</i><b>${p.missions}</b></span></div></div></div>`};
  return `<div class="status">${card("sai")}${card("yui")}
    <div class="love"><div class="love-h"><span>ふたりの仲良し度</span><b>${st.love}%</b></div><div class="love-bar"><i style="width:${st.love}%"></i></div><div class="love-s"><span>御朱印<b>${st.stamped}/${st.spots}</b></span><span>日記<b>${st.diaries}/6</b></span><span>ミッション<b>${st.ms}</b></span><span>グルメ<b>${st.foods}/${FOODS.length}</b></span></div>
    ${(()=>{const lv=konLvOf(st.love),kd=konDoneCount();return `<div class="konlove"><img src="kon-v2.webp" alt="">こんぺき → ゆいちゃん<b>${"♥".repeat(lv+1)}<i>${"♥".repeat(3-lv)}</i></b><span>${KON_LV[lv]}</span><small>仲良し度と「こんぺきのお願い」${kd?`（${kd}回クリア）`:""}で変わります</small></div>`})()}</div></div>`;
}

/* ---------- ふたりの瓦版（できごと） ---------- */
function newsItems(){
  const ev=[];const spotName=id=>SPOTS().find(s=>s.id===id)?.n||"どこか";
  const albumRuns=[];
  for(const p of S.photos){
    if(p.spot){ev.push({at:p.at,t:`${NAME[p.who]}が「${spotName(p.spot)}」でとうちゃく写真をあげた`,k:"stamp"});continue}
    if(p.food){ev.push({at:p.at,t:`${NAME[p.who]}が図鑑の「${FOODBY[p.food]?.n||"？"}」をゲット！`,k:"food"});continue}
    const last=albumRuns[albumRuns.length-1];
    if(last&&last.who===p.who&&p.at-last.at<15*60e3){last.n++;last.at=p.at}else albumRuns.push({who:p.who,at:p.at,n:1});
  }
  for(const r of albumRuns)ev.push({at:r.at,t:`${NAME[r.who]}がアルバムに写真を${r.n}枚追加した`,k:"album"});
  for(const s of SPOTS()){const p=spotPhotos(s.id);if(p.sai&&p.yui)ev.push({at:Math.max(p.sai.at,p.yui.at),t:`「${s.n}」の御朱印がそろった！`,k:"done"})}
  for(const [k,m] of Object.entries(S.missions)){const n=+k.replace("day","");for(const x of m.draws||[]){if(x.done&&x.doneAt)ev.push({at:x.doneAt,t:`${NAME[x.by]||"ふたり"}がDAY${n}のミッション「${mtext(MBYID[x.id],DAYS()[n-1]).slice(0,18)}…」をクリア`,k:"mission"})}}
  for(const [k,d] of Object.entries(S.diary)){const m=k.match(/^d(\d)_(sai|yui)$/);if(m&&d.at)ev.push({at:d.at,t:`${NAME[m[2]]}がDAY${m[1]}の日記を書いた`,k:"diary"})}
  for(const [w,l] of Object.entries(S.letters)){if(l?.at)ev.push({at:l.at,t:`${NAME[w]}が最終日にひらく手紙を書いた`,k:"letter"})}
  if(S.plan?.updatedAt)ev.push({at:S.plan.updatedAt,t:`${NAME[S.plan.by]||"だれか"}がしおりを更新した`,k:"plan"});
  return ev.sort((a,b)=>b.at-a.at).slice(0,6);
}
function newsHTML(){
  const ev=newsItems();
  return `<div class="news"><div class="news-h"><span class="news-tag">ふたりの瓦版</span></div>${ev.length?`<ul>${ev.map(e=>`<li class="k-${e.k}"><span class="when">${relTime(e.at)}</span>${esc(e.t)}</li>`).join("")}</ul>`:`<div class="small muted">まだニュースはありません。写真や日記で、島がにぎやかになっていくよ。</div>`}</div>`;
}

async function geocode(q){
  try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&viewbox=134.3,35.8,136.6,33.8&bounded=1&q="+encodeURIComponent(q),{signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined});
    if(!r.ok)return null;const j=await r.json();

function parseLatLng(s){s=String(s||"").trim();if(!s)return null;
  if(/goo\.gl|maps\.app/i.test(s)&&!/@-?\d/.test(s))return {err:"短いリンクには座標が入っていません。Googleマップで場所を長押しして、上に出る数字（26.xxxx, 127.xxxx）をコピーして貼ってね"};
  const m=s.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/)||s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/)||s.match(/[?&](?:q|ll|query|center|destination|daddr|saddr)=(-?\d{1,2}\.\d+)(?:,|%2C)(-?\d{1,3}\.\d+)/i)||s.match(/^(-?\d{1,2}\.\d+)\s*[,、\s]\s*(-?\d{1,3}\.\d+)$/);
  if(!m)return {err:"座標が見つかりませんでした。「26.5047, 127.8503」の形か、座標入りのGoogleマップのリンクを貼ってね"};
  const lat=+m[1],lng=+m[2];if(lat<33||lat>36.5||lng<133.5||lng>137.5)return {err:"関西の外の座標みたい。もう一度確認してね"};return {lat,lng};
}

}

/* ---------- 旅の軌跡マップ（写真の撮影場所をつないで表示） ---------- */
function photoCoord(p){
  if(typeof p.lat==="number"&&typeof p.lng==="number")return {lat:p.lat,lng:p.lng,src:"gps"};
  const d=p.day>=1&&p.day<=6?DAYS()[p.day-1]:null;
  if(p.spot){const s=DAYS().flatMap(x=>x.stops||[]).find(x=>x.id===p.spot);const c=s?coordOf(s):(COORDS[p.spot]?{lat:COORDS[p.spot][0],lng:COORDS[p.spot][1]}:null);if(c)return {...c,src:"spot"}}
  if(d){const tm=p.taken||p.at||0;const j=new Date(tm+9*3600e3);const min=j.getUTCHours()*60+j.getUTCMinutes();const stops=(d.stops||[]).map(s=>({s,c:coordOf(s),m:stopMin(s)})).filter(x=>x.c);
    if(stops.length){let best=stops[0];for(const x of stops){if(x.m!=null&&x.m<=min)best=x}return {...best.c,src:"est",stop:best.s}}}
  return null;
}
function trailData(sel,km=.25){ // km: この距離より近い写真はひとつの丸にまとめる
  const days=sel==="all"?[1,2,3,4,5,6]:[+sel];const out={clusters:[],lines:[],km:0,total:0,n:{gps:0,spot:0,est:0}};
  for(const n of days){const ph=S.photos.filter(p=>p.day===n).sort((a,b)=>(a.taken||a.at||0)-(b.taken||b.at||0));out.total+=ph.length;const cl=[];
    for(const p of ph){const c=photoCoord(p);if(!c)continue;out.n[c.src]++;const hit=cl.find(q=>haversine(q,c)<km);
      if(hit){hit.items.push(p);if(c.src!=="est")hit.est=false}else cl.push({d:n,lat:c.lat,lng:c.lng,items:[p],est:c.src==="est",stop:c.stop||null})}
    out.clusters.push(...cl);if(cl.length>1)out.lines.push({d:n,pts:cl.map(q=>[q.lat,q.lng])});
    for(let i=1;i<cl.length;i++)out.km+=haversine(cl[i-1],cl[i])*1.3;}
  out.km=Math.round(out.km*10)/10;return out;
}

/* ---------- 画像 ---------- */
async function decode(file){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch{}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej({code:"decode"})};i.src=u})}
function toJpeg(src,max,q){const w=src.width,h=src.height,s=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej({code:"encode"}),"image/jpeg",q))}
// 撮影情報（EXIF）から、撮った場所と時刻だけを読む（JPEG と HEIC。保存する画像からは取り除かれる）
async function readExif(file){
  try{
    const buf=new Uint8Array(await file.slice(0,6*1024*1024).arrayBuffer());let off=-1;
    if(buf[0]===0xFF&&buf[1]===0xD8){let i=2;while(i+4<buf.length){if(buf[i]!==0xFF){i++;continue}const mk=buf[i+1];if(mk===0xFF){i++;continue}if(mk===0xD8||mk===0x01||(mk>=0xD0&&mk<=0xD7)){i+=2;continue}if(mk===0xDA||mk===0xD9)break;const len=(buf[i+2]<<8)|buf[i+3];
      if(mk===0xE1&&buf[i+4]===0x45&&buf[i+5]===0x78&&buf[i+6]===0x69&&buf[i+7]===0x66){off=i+10;break}i+=2+len}}
    else{const lim=buf.length-10;for(let i=0;i<lim;i++){if(buf[i]===0x45&&buf[i+1]===0x78&&buf[i+2]===0x69&&buf[i+3]===0x66&&buf[i+4]===0&&buf[i+5]===0){const a=buf[i+6],b=buf[i+7];if((a===0x49&&b===0x49)||(a===0x4D&&b===0x4D)){off=i+6;break}}}}
    if(off<0)return null;
    const dv=new DataView(buf.buffer,buf.byteOffset+off);const le=dv.getUint16(0)===0x4949;const u16=q=>dv.getUint16(q,le),u32=q=>dv.getUint32(q,le);if(u16(2)!==42)return null;
    const readIFD=(q,want)=>{const n=u16(q);const out={};for(let i=0;i<n;i++){const e=q+2+i*12;const tag=u16(e),type=u16(e+2),cnt=u32(e+4);if(!want.has(tag))continue;const sz=[0,1,1,2,4,8,1,1,2,4,8,4,8][type]||1;const vp=sz*cnt>4?u32(e+8):e+8;
      if(type===2){let s="";for(let k=0;k<cnt-1;k++)s+=String.fromCharCode(dv.getUint8(vp+k));out[tag]=s}
      else if(type===5||type===10){const arr=[];for(let k=0;k<cnt;k++){const a=u32(vp+k*8),b=u32(vp+k*8+4);arr.push(b?a/b:0)}out[tag]=arr}
      else if(type===3)out[tag]=u16(vp);else if(type===4)out[tag]=u32(vp)}return out};
    const ifd0=readIFD(u32(4),new Set([0x8769,0x8825]));const exif=ifd0[0x8769]?readIFD(ifd0[0x8769],new Set([0x9003,0x9011])):{};const gps=ifd0[0x8825]?readIFD(ifd0[0x8825],new Set([1,2,3,4])):{};
    const out={};const dt=exif[0x9003];
    if(dt){const m=String(dt).match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);if(m){let tm=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);const z=exif[0x9011]&&String(exif[0x9011]).match(/([+-])(\d{2}):(\d{2})/);const offMin=z?(z[1]==="-"?-1:1)*(+z[2]*60+ +z[3]):540;tm-=offMin*60e3;if(tm>Date.UTC(2000,0,1)&&tm<Date.now()+7*864e5)out.taken=tm}}
    if(gps[2]&&gps[4]){const deg=(a,ref)=>{const v=(a[0]||0)+(a[1]||0)/60+(a[2]||0)/3600;return (ref==="S"||ref==="W")?-v:v};const lat=deg(gps[2],gps[1]),lng=deg(gps[4],gps[3]);if(isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&(lat||lng)){out.lat=+lat.toFixed(5);out.lng=+lng.toFixed(5)}}
    return out;
  }catch{return null}
}
function dayFromTaken(tm){if(tm){const n=Math.floor((tm-START)/864e5)+1;if(n>=1&&n<=6)return n;return 0}const td=tripDay();return td>=1&&td<=6?td:0}
async function uploadPhoto(file,{spot=null,day=0,food=null}){
  if(!S.assets)throw{code:"not_granted"};
  const ex=await readExif(file);if(day==null)day=dayFromTaken(ex?.taken);
  const img=await decode(file);
  // 保存先の容量（無料枠1GB）を考えて、長辺2560pxに整えて保存（スマホで見るには十分な高画質）
  const W=img.width,H=img.height;const full=await toJpeg(img,2560,.88);const thumb=await toJpeg(img,720,.8);try{img.close?.()}catch{}
  const [F,T]=await Promise.all([S.assets.upload(full,{type:"image/jpeg"}),S.assets.upload(thumb,{type:"image/jpeg"})]);
  await ensureUrls([F.id,T.id]);
  const doc={full:F.id,thumb:T.id,w:W,h:H,who:S.who,day,spot,food,at:Date.now()};if(ex?.taken)doc.taken=ex.taken;if(ex?.lat!=null){doc.lat=ex.lat;doc.lng=ex.lng}
  await S.db.collection("photos").add(doc);
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("canvas");c.className="confetti";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const g=c.getContext("2d"),cs=getComputedStyle(document.documentElement),cols=["--kin","--shu","--paper","--gold","--hibiscus"].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,vy:2+Math.random()*3,vx:-1.5+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function tick(){g.clearRect(0,0,c.width,c.height);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.r+=.1;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()}
    if(++f<120)requestAnimationFrame(tick);else c.remove()})();
}
