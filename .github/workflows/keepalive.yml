# タイムカプセルを守るための見まわり。
# 週に2回 Supabase にアクセスして、無料プランの「1週間アクセスなしで一時停止」を防ぐ。
# GitHub は 60 日間リポジトリに動きがないと定期実行を止めるので、月に1回ほど小さな記録も残す。
name: keepalive
on:
  schedule:
    - cron: "17 3 * * 1,4"   # 月・木の 12:17（日本時間）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keepalive
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase にアクセス
        env:
          SB_URL: https://rplymvjbetvjsfihozpp.supabase.co
          SB_KEY: sb_publishable_nqGwemzuILxckcYS8rtIGQ_4kwkulhH   # サイトにも載っている公開用の鍵
        run: |
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 30 \
              "$SB_URL/rest/v1/docs?select=id&limit=1" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo 000)
            echo "try $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then echo "::error::Supabase に届きませんでした（一時停止されているかもしれません）"; cat /tmp/out || true; exit 1; fi
      - uses: actions/checkout@v4
      - name: 月に1回ほど記録を残す
        run: |
          last=$(cat .keepalive 2>/dev/null || echo 1970-01-01)
          days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "last=$last days=$days"
          if [ "$days" -ge 25 ]; then
            date -u +%F > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive: $(date -u +%F)"
            git push
          fi
